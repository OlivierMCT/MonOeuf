<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Œuf Frais</title>
    <meta name="description" content="Cet œuf est-il encore bon ? Fraîcheur selon la date de ponte ou la DCR, décodage du code de la coquille, conseils de conservation. Fonctionne hors ligne." />
    <!-- Remplacée par /<nom du dépôt>/ au déploiement sur GitHub Pages (voir .github/workflows/pages.yml). -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFF3DC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Œuf Frais" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Avant .NET : applique la palette et le thème mémorisés (pas de flash de mauvaises
         couleurs) et enregistre le service worker. -->
    <script src="js/app.js"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="chargement" aria-hidden="true">
            <img src="icons/icon.svg" alt="" width="96" height="96" />
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        Une erreur est survenue.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss" aria-hidden="true">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
